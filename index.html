<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Kit – Rechnungen in 60 Sekunden</title>
<meta name="description" content="Kostenloser, datenschutzfreundlicher Rechnungsgenerator für Freelancer. Keine Anmeldung, keine Server, alles im Browser.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--ink);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:600;background:#ea4aaa;padding:6px 12px;border-radius:6px;font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;max-width:1300px;margin:20px auto;padding:0 16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{font-size:15px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h2:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--muted);margin-top:8px}
input,textarea,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table.items{width:100%;border-collapse:collapse}
table.items td{padding:3px}
table.items input{padding:6px}
button{cursor:pointer;border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:600}
.primary{background:var(--accent);color:#fff}
.ghost{background:#eef2ff;color:var(--accent)}
.del{background:none;color:#dc2626;padding:4px 8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#preview{background:#fff;color:#111;padding:40px;min-height:800px;border:1px solid var(--line);border-radius:10px;font-size:13px}
#preview h1{font-size:26px;margin:0 0 4px}
#preview .top{display:flex;justify-content:space-between;gap:20px;margin-bottom:30px}
#preview table{width:100%;border-collapse:collapse;margin:20px 0}
#preview th{text-align:left;border-bottom:2px solid #111;padding:6px 4px}
#preview td{border-bottom:1px solid #ddd;padding:6px 4px}
#preview .r{text-align:right}
#preview .tot{width:280px;margin-left:auto}
#preview .tot div{display:flex;justify-content:space-between;padding:3px 0}
#preview .tot .big{font-weight:700;font-size:16px;border-top:2px solid #111;margin-top:4px;padding-top:6px}
#preview .foot{margin-top:40px;font-size:11px;color:#555;white-space:pre-line}
.pre{white-space:pre-line}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media print{header,.card.form,footer{display:none!important}main{display:block;margin:0;padding:0}#preview{border:0;padding:0}body{background:#fff}}
</style>
</head>
<body>
<header>
  <strong>🧾 Invoice Kit</strong>
  <a href="https://github.com/sponsors/ghostfanman" target="_blank" rel="noopener">♥ Sponsor</a>
</header>
<main>
  <section class="card form">
    <h2>Absender</h2>
    <input id="from" placeholder="Name / Firma">
    <textarea id="fromAddr" placeholder="Adresse, E-Mail, Telefon"></textarea>
    <div class="row">
      <div><label>USt-IdNr. / Steuernummer</label><input id="taxId"></div>
      <div><label>IBAN</label><input id="iban"></div>
    </div>
    <h2>Empfänger</h2>
    <input id="to" placeholder="Kunde">
    <textarea id="toAddr" placeholder="Adresse"></textarea>
    <h2>Rechnung</h2>
    <div class="row">
      <div><label>Rechnungsnummer</label><input id="num"></div>
      <div><label>Datum</label><input id="date" type="date"></div>
    </div>
    <div class="row">
      <div><label>Fällig in (Tagen)</label><input id="due" type="number" value="14"></div>
      <div><label>Währung</label><select id="cur"><option>EUR</option><option>USD</option><option>CHF</option><option>GBP</option></select></div>
    </div>
    <div class="row">
      <div><label>MwSt. %</label><input id="vat" type="number" value="19"></div>
      <div><label>Kleinunternehmer (§19 UStG)</label><select id="small"><option value="0">Nein</option><option value="1">Ja</option></select></div>
    </div>
    <h2>Positionen</h2>
    <table class="items"><tbody id="items"></tbody></table>
    <button class="ghost" id="add">+ Position</button>
    <h2>Notiz</h2>
    <textarea id="note" placeholder="Vielen Dank für Ihren Auftrag!"></textarea>
    <div class="actions">
      <button class="primary" onclick="window.print()">Als PDF drucken</button>
      <button class="ghost" id="export">JSON exportieren</button>
      <button class="ghost" id="importBtn">JSON importieren</button>
      <input type="file" id="importFile" accept=".json" hidden>
      <button class="ghost" id="reset">Neu</button>
    </div>
  </section>
  <section id="preview"></section>
</main>
<footer>Invoice Kit · MIT · Alle Daten bleiben in deinem Browser. Gefällt's dir? <a href="https://github.com/sponsors/ghostfanman">Unterstütze das Projekt</a>.</footer>
<script>
const $=id=>document.getElementById(id);
const fields=["from","fromAddr","taxId","iban","to","toAddr","num","date","due","cur","vat","small","note"];
const KEY="invoice-kit-v1";
let items=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return new Intl.NumberFormat("de-DE",{style:"currency",currency:$("cur").value}).format(n||0)}
function renderItems(){
  $("items").innerHTML=items.map((it,i)=>`<tr>
    <td style="width:55%"><input data-i="${i}" data-k="desc" value="${esc(it.desc)}" placeholder="Leistung"></td>
    <td><input data-i="${i}" data-k="qty" type="number" step="any" value="${it.qty}"></td>
    <td><input data-i="${i}" data-k="price" type="number" step="any" value="${it.price}"></td>
    <td><button class="del" data-del="${i}">✕</button></td></tr>`).join("");
}
function state(){const s={items};fields.forEach(f=>s[f]=$(f).value);return s}
function load(s){fields.forEach(f=>{if(s[f]!==undefined)$(f).value=s[f]});items=s.items||[];renderItems();update()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state()))}catch(e){}}
function update(){
  const s=state(),small=s.small==="1",vatP=small?0:parseFloat(s.vat)||0;
  const net=items.reduce((a,it)=>a+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0);
  const vat=net*vatP/100,d=s.date?new Date(s.date):new Date();
  const due=new Date(d);due.setDate(due.getDate()+(parseInt(s.due)||0));
  const f=x=>x.toLocaleDateString("de-DE");
  $("preview").innerHTML=`
    <div class="top"><div><h1>Rechnung</h1><div>Nr. ${esc(s.num)}</div><div>Datum: ${f(d)}</div><div>Fällig: ${f(due)}</div></div>
    <div style="text-align:right"><strong>${esc(s.from)}</strong><div class="pre">${esc(s.fromAddr)}</div></div></div>
    <div><strong>${esc(s.to)}</strong><div class="pre">${esc(s.toAddr)}</div></div>
    <table><thead><tr><th>Beschreibung</th><th class="r">Menge</th><th class="r">Preis</th><th class="r">Summe</th></tr></thead><tbody>
    ${items.map(it=>`<tr><td>${esc(it.desc)}</td><td class="r">${esc(it.qty)}</td><td class="r">${money(+it.price)}</td><td class="r">${money((+it.qty||0)*(+it.price||0))}</td></tr>`).join("")}
    </tbody></table>
    <div class="tot"><div><span>Netto</span><span>${money(net)}</span></div>
    ${small?"":`<div><span>MwSt. ${vatP}%</span><span>${money(vat)}</span></div>`}
    <div class="big"><span>Gesamt</span><span>${money(net+vat)}</span></div></div>
    ${small?`<p style="margin-top:20px">Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</p>`:""}
    <p class="pre" style="margin-top:20px">${esc(s.note)}</p>
    <div class="foot">${esc(s.from)}${s.taxId?" · USt/St-Nr.: "+esc(s.taxId):""}${s.iban?"\nIBAN: "+esc(s.iban):""}</div>`;
  save();
}
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.i!==undefined){items[t.dataset.i][t.dataset.k]=t.value}update()});
document.addEventListener("click",e=>{if(e.target.dataset.del!==undefined){items.splice(+e.target.dataset.del,1);renderItems();update()}});
$("add").onclick=()=>{items.push({desc:"",qty:1,price:0});renderItems();update()};
$("export").onclick=()=>{const b=new Blob([JSON.stringify(state(),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`rechnung-${$("num").value||"entwurf"}.json`;a.click()};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{const r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result))}catch(err){}};r.readAsText(e.target.files[0])};
$("reset").onclick=()=>{const keep={from:$("from").value,fromAddr:$("fromAddr").value,taxId:$("taxId").value,iban:$("iban").value,due:$("due").value,cur:$("cur").value,vat:$("vat").value,small:$("small").value};load({...keep,to:"",toAddr:"",note:"",num:nextNum(),date:today(),items:[{desc:"",qty:1,price:0}]})};
function today(){return new Date().toISOString().slice(0,10)}
function nextNum(){const n=$("num").value.match(/(\d+)$/);return n?$("num").value.replace(/\d+$/,String(+n[1]+1).padStart(n[1].length,"0")):new Date().getFullYear()+"-001"}
let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
load(saved||{num:new Date().getFullYear()+"-001",date:today(),items:[{desc:"Webdesign – Landingpage",qty:1,price:850},{desc:"Beratung (Std.)",qty:3,price:90}],note:"Vielen Dank für Ihren Auftrag!"});
</script>
</body>
</html>
