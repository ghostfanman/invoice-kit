name: Validierung

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validatoren aus dem Cache
        uses: actions/cache@v4
        with:
          path: |
            .validators
            ~/.m2/repository
          key: validators-${{ hashFiles('tools/validate-exports.sh', 'tools/kosit-config.py') }}
      - name: Unit-Tests und statische Prüfung
        run: |
          node --test test/*.test.js
          node test/static-check.mjs
          python3 -m py_compile integration/build-wambur.py
      - name: Browsertest
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          CHROMIUM=google-chrome node test/browser-check.mjs
      - name: Konformität mit KoSIT, Mustang und veraPDF
        run: CHROMIUM=google-chrome tools/validate-exports.sh
      - name: Prüfbericht in der Zusammenfassung
        if: always()
        run: '[ -f .test-artifacts/validation/BERICHT.md ] && cat .test-artifacts/validation/BERICHT.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruefbericht
          path: .test-artifacts/validation
          retention-days: 30
