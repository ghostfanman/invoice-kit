# Einzelner Prozess, persistentes Datenverzeichnis, Port nur lokal (Reverse Proxy davor, siehe docs/operations.md).
services:
  repolaunch:
    build: .
    image: repolaunch:local
    restart: unless-stopped
    env_file: .env
    environment:
      REPOLAUNCH_DATA_DIR: /data
      # Hinter genau einem Reverse Proxy, der X-Forwarded-For setzt:
      TRUST_PROXY_HOPS: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
